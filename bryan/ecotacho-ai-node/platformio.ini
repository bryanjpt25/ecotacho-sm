[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 1. Velocidad de comunicación con la PC y depurador de errores
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 2. Gestión de Librerías (Ejemplo)
lib_deps = 
    bblanchon/ArduinoJson @ ^7.4.3
    knolleary/PubSubClient @ ^2.8

; 3. Directivas de Compilador (Tu futuro salvavidas para la ESP32-CAM)
; Directivas para la ESP32-CAM (Se quedan comentadas hasta tener la placa con cámara)
; build_flags = 
;    -DBOARD_HAS_PSRAM
;    -mfix-esp32-psram-cache-issue

; 4. Partición de Memoria (Necesario para modelos TinyML pesados)
; board_build.partitions = huge_app.csv
